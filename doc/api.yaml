                name:
                  type: string
                  example: "Disorder"
                artistId:
                  type: string
                  format: uuid
                  nullable: true
                  example: null
                albumId:
                  type: string
                  format: uuid
                  nullable: true
                  example: null
                duration:
                  type: integer
                  description: In seconds
                  example: 220
              required:
                - name
                - duration
      responses:
        201:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        400:
          description: Bad Request. body does not contain required fields, or required fields are not valid
          content:
            application/json:
              schema:
                type: object
                properties: 
                  message:
                    type: array
                    example: ['name must be longer than or equal to 1 characters', 'artistId must be a UUID', 'albumId must be a UUID', 'duration must be an integer number']
                  error:
                    type: string
                    example: 'Bad Request'
                  statusCode:
                    type: number
                    example: 400
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          description: Not Found. Artist ID or Album ID doesn't exist
          content:
            application/json:
              schema:
                type: object
