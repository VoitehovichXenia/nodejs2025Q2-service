                    example: 'Track ID is not valid UUID'
                  error:
                    type: string
                    example: 'Bad Request'
                  statusCode:
                    type: number
                    example: 400
        401:
          $ref: '#/components/responses/UnauthorizedError'
        404:
          description: Track was not found.
          content:
            application/json:
              schema:
                type: object
                properties:
