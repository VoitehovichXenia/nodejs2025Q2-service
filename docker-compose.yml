version: '3.9'

services:
  database:
    image: abjektmar/home_library_database:latest
    build:
      context: ./docker/postgres
    container_name: home_library_database
    restart: always
    env_file:
      - .env
    ports:
      - '5432:5432'
    networks:
      - backend
    volumes:
      - database_data:/var/lib/postgresql/data
  
  app:
    image: abjektmar/home_library_app:latest
    build: 
      context: .
      dockerfile: ./docker/app/Dockerfile
    container_name: home_library_app
    restart: always
    depends_on:
      - database
    env_file:
      - .env
    ports:
      - ${PORT}:${PORT}
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  database_data:
    